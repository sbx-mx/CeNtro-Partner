name: Deploy CeNtro Partner to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/Base_CeNtro Partner.xlsx"
      - "docs/data/Base_CeNtro Partner.xlsx"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verificar dependencias esenciales
        run: |
          test -d node_modules/react
          test -d node_modules/react-dom
          test -d node_modules/typescript
          test -d node_modules/vite
          test -d node_modules/xlsx

      - name: Bloquear vulnerabilidades críticas
        run: npm run audit:dependencies

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar validador
        run: python -m pip install --requirement requirements-validation.txt

      - name: Resolver Excel motor
        id: excel
        run: python scripts/excel_release.py resolve

      - name: Sincronizar Excel motor para compilación
        env:
          EXCEL_SOURCE: ${{ steps.excel.outputs.excel_source }}
        run: python scripts/sync_workbook.py "$EXCEL_SOURCE" --target public

      - name: Validar Excel motor
        run: |
          python scripts/validate_workbook.py "public/data/Base_CeNtro Partner.xlsx" --output public/data/workbook-audit.json

      - name: Validar TypeScript
        run: npm run check

      - name: Compilar aplicacion
        run: npm run build

      - name: Registrar versión del Excel
        run: python scripts/excel_release.py metadata --excel "public/data/Base_CeNtro Partner.xlsx" --index dist/index.html --output dist/data/excel-release.json

      - name: Validar salida de produccion
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f "dist/data/Base_CeNtro Partner.xlsx"
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -q '%BASE_URL%' dist/index.html
          touch dist/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicacion compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
