name: Actualizar únicamente Excel en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/data/Base_CeNtro Partner.xlsx"
      - "docs/data/Base_CeNtro Partner.xlsx"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      excel_only: ${{ steps.mode.outputs.excel_only }}
      excel_source: ${{ steps.mode.outputs.excel_source }}
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirmar actualización exclusiva de Excel
        id: mode
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/excel_release.py detect --force
          else
            python scripts/excel_release.py detect --before "$BEFORE_SHA" --after "$CURRENT_SHA"
          fi

      - name: Instalar validador
        if: steps.mode.outputs.excel_only == 'true'
        run: python -m pip install --requirement requirements-validation.txt

      - name: Preparar sitio sin recompilar Index
        if: steps.mode.outputs.excel_only == 'true'
        env:
          EXCEL_SOURCE: ${{ steps.mode.outputs.excel_source }}
        run: python scripts/excel_release.py stage --excel "$EXCEL_SOURCE" --output dist

      - name: Configurar GitHub Pages
        if: steps.mode.outputs.excel_only == 'true'
        uses: actions/configure-pages@v5

      - name: Subir sitio con Excel actualizado
        if: steps.mode.outputs.excel_only == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.prepare.outputs.excel_only == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    steps:
      - name: Publicar Excel actualizado
        id: deployment
        uses: actions/deploy-pages@v4
